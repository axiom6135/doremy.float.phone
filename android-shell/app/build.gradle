plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名：CI 里通过环境变量注入 keystore（见 android-shell/README.md）；
// 没有配置时 release 构建产出未签名 APK，debug 构建始终可直接安装测试。
def ksFile = System.getenv("SHELL_KEYSTORE_FILE")
def ksStorePass = System.getenv("SHELL_KEYSTORE_PASSWORD")
def ksKeyAlias = System.getenv("SHELL_KEY_ALIAS")
def ksKeyPass = System.getenv("SHELL_KEY_PASSWORD")

// AGP 的 signingConfig 没有 storeType 选项，keystore 一律按 JDK 默认的
// PKCS12 解析。喂给它 JKS 时会到打包才炸：KeytoolException:
// DerInputStream.getLength(): lengthTag=109——0xED 正是 JKS 魔数
// FE ED FE ED 的第二个字节被当成了 DER 长度。所以在配置阶段按文件头分流：
// JKS 先在内存里转成 PKCS12（写到 build 目录）再交给 AGP；
// 文件头既不是 JKS 也不是 PKCS12（secret 二次 base64/截断/带引号，解码出
// 文本）就直接抛错，别等到 packageDebug。
if (ksFile) {
    def f = file(ksFile)
    if (!f.isFile()) {
        throw new GradleException("SHELL_KEYSTORE_FILE 指向的文件不存在：${ksFile}")
    }
    def head = new byte[2]
    f.withInputStream { it.read(head, 0, 2) }
    def magic = head.encodeHex().toString()
    if (magic == 'feed') {
        def src = java.security.KeyStore.getInstance('JKS')
        try {
            f.withInputStream { src.load(it, ksStorePass?.toCharArray()) }
        } catch (java.io.EOFException e) {
            // JKS 是自描述长度格式：文件头正确但提前结束只会是截断，
            // 典型成因是 base64 只粘贴了一部分（例如多行输出只复制了首行）。
            throw new GradleException(
                "SHELL_KEYSTORE_FILE 指向的 ${ksFile} 是截断的 JKS keystore" +
                "（大小 ${f.length()} 字节）。\n" +
                "说明 SHELL_KEYSTORE_BASE64 解码出来的内容不完整。\n" +
                "请重新生成并整体覆盖该 secret：base64 -w0 shell.keystore" +
                "（macOS 用 base64 -b0，单行输出），确认解码后文件大小与原始 keystore 一致。")
        } catch (java.io.IOException e) {
            throw new GradleException(
                "无法打开 ${ksFile}：${e.message}\n" +
                "文件头正常，通常是 SHELL_KEYSTORE_PASSWORD 与 keystore 不匹配。")
        }
        if (!src.containsAlias(ksKeyAlias)) {
            throw new GradleException(
                "keystore 中不存在别名 ${ksKeyAlias}，实际别名：${src.aliases().toList().join(', ')}。\n" +
                "请把 SHELL_KEY_ALIAS 改成上面列出的某个别名。")
        }
        def dst = java.security.KeyStore.getInstance('PKCS12')
        dst.load(null, null)
        def key
        try {
            key = src.getKey(ksKeyAlias, (ksKeyPass ?: ksStorePass)?.toCharArray())
        } catch (java.security.UnrecoverableKeyException e) {
            throw new GradleException(
                "无法用 SHELL_KEY_PASSWORD 解出别名 ${ksKeyAlias} 的私钥。\n" +
                "请确认 SHELL_KEY_PASSWORD 正确（JKS 里 key 密码可以和 store 密码不同）。")
        }
        dst.setKeyEntry(ksKeyAlias, key, ksStorePass?.toCharArray(),
                src.getCertificateChain(ksKeyAlias))
        def out = new File(layout.buildDirectory.get().asFile, 'shell-signing.p12')
        out.parentFile.mkdirs()
        out.withOutputStream { dst.store(it, ksStorePass?.toCharArray()) }
        ksFile = out.absolutePath
        // PKCS12 的 key 密码必须与 store 密码一致
        ksKeyPass = ksStorePass
    } else if (magic != '3082') {
        throw new GradleException(
            "SHELL_KEYSTORE_FILE 指向的 ${ksFile} 不是有效的 JKS/PKCS12 keystore（文件头 ${magic}）。\n" +
            "通常是 SHELL_KEYSTORE_BASE64 配错：二次 base64、被截断或带了引号。\n" +
            "请重新生成：base64 -w0 shell.keystore（macOS: base64 -b0 shell.keystore），" +
            "输出整体覆盖该 secret，不要二次编码、不要加引号。")
    }
}
def siteUrl = (System.getenv("SHELL_SITE_URL") ?: "https://example.invalid").replaceAll('/+$', '')

android {
    namespace 'app.floatphone.shell'
    // compileSdk 36：Health Connect 1.1.0 的硬性要求（它的 AAR 元数据要求
    // minCompileSdk=36）。这里只抬 compileSdk，**targetSdk 保持 34 不动**——
    // targetSdk 决定运行时的行为约定（如边到边布局），动它会影响已经调好的
    // WebView 全屏布局，那是另一件事，得单独验证，不该顺手带上。
    compileSdk 36

    defaultConfig {
        applicationId "app.floatphone.shell"
        minSdk 26
        targetSdk 34
        // versionCode 必须严格递增，否则 Android 拒绝覆盖安装（表现为「应用未安装」）。
        // 1.0.7：回复条配色逐项自定义；1.0.8：浮窗自检与失败留痕。
        // 1.0.9：修 TransactionTooLargeException（头像经 Intent 撑爆 Binder 上限）。
        // 1.0.10：浮窗改圆角矩形；浮窗左上角显示「待发 N」角标。
        // 1.0.11：截屏与主动查岗（含查岗浮层回复框）；通知栏「直接回复」。
        // 1.0.12：截屏可选收件人；位置感知；睡眠（Health Connect）。
        // 1.0.13：原生后台应用时长监测、现实桥事件补传与返回学习软件通知。
        // 1.0.14：运行诊断页与原生设备/权限快照。
        // 1.0.16：短视频分享链接原生解析与限额临时缓存。
        // 1.0.18：原生桥改用 UI 线程缓存的页面 URL，修复后台线程读 WebView 导致的 Java exception。
        // 1.0.19：保存图片不再被可信页面门禁挡住；允许本地解析 localhost 明文 + WebView 混合内容。
        // 1.0.20：大文件分块写入，修复导出/下载大备份时 WebView OOM；持久化 WebView 崩溃报告。
        // 1.0.21：全局陪看改走无障碍截屏 + 网页分析，原生不再二次解析 API Key。
        // 1.0.22：全局陪看横幅折叠/贴顶；小组件 pin 回调 profileId 双通道。
        // 1.0.23：全局陪看横幅改为 WebView，支持用户 CSS + 预览。
        // 1.0.24：小组件增加系统配置 Activity，多实例显式绑定 profile。
        // 1.0.25：查岗浮层横屏滚动/关闭按钮/动态高度。
        // 1.0.26：通知回复原生队列改为 peek/ack，网页持久化成功后再确认。
        // 1.0.27：移除当前功能未使用的敏感权限，统一原生诊断与 APK 版本号。
        // 1.0.28：release 关闭 WebView 调试，并禁用 Android 自动备份，使用应用内显式导出。
        // 1.0.29：AndroidShell / PhoneWidget 使用顶层 nonce 桥，第三方 iframe 无法调用原生能力。
        versionCode 28
        versionName "1.0.29"
        buildConfigField "String", "SITE_URL", "\"${siteUrl}\""
    }

    buildFeatures { buildConfig true }

    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
        debug {
            // 有固定签名时 debug 也用同一把钥匙。
            // CI 每次构建都是全新容器，自动生成的 debug 密钥每次都不同——
            // 签名一变就只能卸载重装，App 数据（WebView 沙盒里的聊天记录、
            // 角色卡）会一起丢。统一签名后 debug / release 两个包可以互相
            // 覆盖安装，选哪个都不会再触发「应用未安装」。
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Health Connect：读睡眠。选它而不是各厂商自己的运动 App SDK，
    // 是因为它由系统统一汇聚（华为/小米/三星健康都往里写），接一次就够，
    // 不必为每个 ROM 各写一套。代价是用户得在系统里装/启用它并逐项授权。
    //
    // 版本 1.1.0（稳定版）。注意它抬高了整条构建链的门槛：AAR 元数据要求
    // compileSdk 36 + AGP 8.9.1+，所以根 build.gradle 与 CI workflow 里的
    // AGP / Gradle 版本是配套改的，三者一起动，单独改一个必然失败。
    // （曾试过降到 1.0.0 想避开升级，但那个版本在 Google Maven 上并不存在。）
    implementation 'androidx.health.connect:connect-client:1.1.0'
    // Health Connect 的读取 API 是挂起函数，而桥要让网页同步读，所以用协程
    // 在后台取、取完写进缓存。显式声明而不是靠传递依赖，避免版本变动就编译失败。
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
